name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Core tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore test project
        run: dotnet restore tests/SteamBuildIdManager.Core.Tests/SteamBuildIdManager.Core.Tests.csproj

      - name: Run regression tests
        run: dotnet run --project tests/SteamBuildIdManager.Core.Tests/SteamBuildIdManager.Core.Tests.csproj -c Release --no-restore

  publish:
    name: Build portable win-x64 package
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore app
        run: dotnet restore src/SteamBuildIdManager.App/SteamBuildIdManager.App.csproj -r win-x64

      - name: Publish self-contained app
        run: >
          dotnet publish src/SteamBuildIdManager.App/SteamBuildIdManager.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Platform=x64
          -p:WindowsAppSDKSelfContained=true
          -p:PublishReadyToRun=false
          -p:GenerateAppxPackageOnBuild=false
          -o publish
          --no-restore

      - name: Bundle SteamCMD into the package
        shell: pwsh
        run: |
          pwsh -File installer/fetch-steamcmd.ps1
          New-Item -ItemType Directory -Path "publish/steamcmd" -Force | Out-Null
          Copy-Item "installer/steamcmd/*" -Destination "publish/steamcmd" -Recurse -Force

      - name: Verify publish output
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/SteamBuildIDManager.exe")) {
            throw "SteamBuildIDManager.exe was not produced."
          }
          if (-not (Get-ChildItem "publish" -Filter "*.pri")) {
            throw "resources.pri was not produced; WinUI would fail to start."
          }
          if (-not (Test-Path "publish/steamcmd/steamcmd.exe")) {
            throw "The bundled SteamCMD payload is missing."
          }

      - name: Sign the published executable
        shell: pwsh
        # Optional: signs only when a certificate secret is configured. Unsigned builds
        # still succeed, they just keep triggering the SmartScreen "unknown publisher" prompt.
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
          SIGNING_THUMBPRINT: ${{ secrets.SIGNING_THUMBPRINT }}
        run: |
          pwsh -File installer/sign.ps1 `
            -PfxBase64 "$env:SIGNING_PFX_BASE64" `
            -PfxPassword "$env:SIGNING_PFX_PASSWORD" `
            -Thumbprint "$env:SIGNING_THUMBPRINT" `
            -Targets "publish/SteamBuildIDManager.exe"

      - name: Add the setup launcher to the package
        shell: pwsh
        run: |
          # Start-Setup.cmd launches the installer with a writable TEMP. Ship it inside the
          # portable zip so the workaround is always available next to the app.
          New-Item -ItemType Directory -Path "publish/installer" -Force | Out-Null
          Copy-Item "installer/launcher/Start-Setup.cmd" -Destination "publish/installer" -Force
          Copy-Item "installer/launcher/Start-Setup.ps1" -Destination "publish/installer" -Force

      - name: Create portable zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath Steam-BuildID-Manager-win-x64.zip -CompressionLevel Optimal

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Steam-BuildID-Manager-win-x64
          path: Steam-BuildID-Manager-win-x64.zip
          if-no-files-found: error

  installer:
    name: Build installer
    runs-on: windows-latest
    needs: publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download portable build
        uses: actions/download-artifact@v4
        with:
          name: Steam-BuildID-Manager-win-x64
          path: artifacts

      - name: Extract portable build
        shell: pwsh
        run: Expand-Archive -Path "artifacts/Steam-BuildID-Manager-win-x64.zip" -DestinationPath "publish" -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Verify installer is per-user
        shell: pwsh
        run: |
          # The installer must request administrator rights: that also moves Inno's own
          # working directory to %WINDIR%\Temp, which Administrators can always write to.
          $iss = Get-Content "installer/SteamBuildIDManager.iss" -Raw
          if ($iss -notmatch '(?m)^\s*PrivilegesRequired\s*=\s*admin\s*$') {
            throw "The installer must request administrator rights (PrivilegesRequired=admin)."
          }
          if ($iss -notmatch '(?m)^\s*DefaultDirName\s*=\s*\{autopf\}') {
            throw "An all-users install must default to {autopf}."
          }
          # A temp-folder pre-check inside the .iss cannot work: Inno extracts itself
          # before any [Code] runs. The launcher is what fixes an unwritable TEMP.
          if ($iss -match 'InitializeSetup') {
            throw "Remove the dead temp pre-check from the script; use Start-Setup.cmd instead."
          }
          if (-not (Test-Path "installer/launcher/Start-Setup.cmd")) {
            throw "The setup launcher is missing."
          }
          if (-not (Test-Path "installer/launcher/Start-Setup.ps1")) {
            throw "The setup launcher script is missing."
          }

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe was not found after installing Inno Setup." }
          & $iscc "installer\SteamBuildIDManager.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE." }

      - name: Sign the installer
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
          SIGNING_THUMBPRINT: ${{ secrets.SIGNING_THUMBPRINT }}
        run: |
          $setup = Get-ChildItem "artifacts/installer" -Filter "*.exe" | Select-Object -First 1
          pwsh -File installer/sign.ps1 `
            -PfxBase64 "$env:SIGNING_PFX_BASE64" `
            -PfxPassword "$env:SIGNING_PFX_PASSWORD" `
            -Thumbprint "$env:SIGNING_THUMBPRINT" `
            -Targets $setup.FullName `
            -Description "Steam BuildID Manager 安装程序"

      - name: Publish the setup launcher
        shell: pwsh
        run: |
          Copy-Item "installer/launcher/Start-Setup.cmd" -Destination "artifacts/installer" -Force
          Copy-Item "installer/launcher/Start-Setup.ps1" -Destination "artifacts/installer" -Force

      - name: Regression test - unwritable TEMP still installs
        shell: pwsh
        run: |
          # Reproduce the reported failure: Inno extracts itself into %TEMP% before any [Code]
          # runs, so a TEMP the user cannot write to aborts with "Error 5: Access is denied".
          # Start-Setup.ps1 must pick another folder and complete a real install.
          $setup = (Get-ChildItem "artifacts/installer" -Filter "*Setup*.exe" | Select-Object -First 1).FullName
          $launcher = (Resolve-Path "artifacts/installer/Start-Setup.ps1").Path

          $broken = Join-Path $env:RUNNER_TEMP ("sbim-broken-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $broken -Force | Out-Null
          & icacls $broken /deny "$($env:USERNAME):(OI)(CI)(W)" | Out-Null

          # Also block the launcher's first choice so it has to walk down the candidate list.
          $firstChoice = Join-Path $env:LOCALAPPDATA "SteamBuildIDManager\InstallTemp"
          New-Item -ItemType Directory -Path $firstChoice -Force | Out-Null
          & icacls $firstChoice /deny "$($env:USERNAME):(OI)(CI)(W)" | Out-Null

          $dir = Join-Path $env:RUNNER_TEMP ("sbim-launcher-" + [guid]::NewGuid().ToString('N'))

          # pwsh -File cannot bind a string[] parameter, so the array literal must live
          # inside a wrapper script instead of on the command line.
          $wrapper = Join-Path $env:RUNNER_TEMP "sbim-launcher-test.ps1"
          $lines = @(
            "`$env:TEMP = '$broken'",
            "`$env:TMP = '$broken'",
            "& '$launcher' -SetupPath '$setup' -Wait -SetupArguments @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS','/DIR=$dir')",
            "exit `$LASTEXITCODE"
          )
          Set-Content -Path $wrapper -Value $lines -Encoding UTF8

          try {
            $p = Start-Process -FilePath "pwsh" -Wait -PassThru `
              -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $wrapper)
            if ($p.ExitCode -ne 0) { throw "Launcher path failed with exit code $($p.ExitCode)." }
            if (-not (Test-Path (Join-Path $dir "SteamBuildIDManager.exe"))) {
              throw "The launcher did not complete an install while TEMP was unwritable."
            }
            Write-Host "Launcher installed successfully while TEMP was blocked."
          }
          finally {
            & icacls $broken /remove:d "$($env:USERNAME)" 2>$null | Out-Null
            & icacls $firstChoice /remove:d "$($env:USERNAME)" 2>$null | Out-Null
          }

          $uninstall = Start-Process -FilePath (Join-Path $dir "unins000.exe") `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with code $($uninstall.ExitCode)." }
          for ($i = 0; $i -lt 30 -and (Test-Path (Join-Path $dir "SteamBuildIDManager.exe")); $i++) {
            Start-Sleep -Seconds 1
          }
          if (Test-Path (Join-Path $dir "SteamBuildIDManager.exe")) {
            throw "Uninstaller left files behind after the launcher install."
          }

      - name: Smoke test install and uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem "artifacts/installer" -Filter "*.exe" | Select-Object -First 1
          if (-not $setup) { throw "Installer output was not produced." }

          $dir = Join-Path $env:RUNNER_TEMP "sbm-install-smoke"
          $install = Start-Process -FilePath $setup.FullName `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', "/DIR=$dir" `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)." }
          if (-not (Test-Path (Join-Path $dir "SteamBuildIDManager.exe"))) { throw "Installed exe is missing." }
          if (-not (Test-Path (Join-Path $dir "steamcmd\steamcmd.exe"))) { throw "The installed bundle is missing the SteamCMD payload." }
          if (-not (Test-Path (Join-Path $dir "SteamBuildIDManager.pri"))) { throw "Installed PRI is missing." }

          # PrivilegesRequired=admin must register the app machine-wide, not per user.
          $key = Get-ChildItem "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall" |
            Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like "*BuildID*" } |
            Select-Object -First 1
          if (-not $key) { throw "Machine-wide uninstall entry was not created." }

          $uninstall = Start-Process -FilePath (Join-Path $dir "unins000.exe") `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' `
            -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with code $($uninstall.ExitCode)." }
          for ($i = 0; $i -lt 30 -and (Test-Path (Join-Path $dir "SteamBuildIDManager.exe")); $i++) {
            Start-Sleep -Seconds 1
          }
          if (Test-Path (Join-Path $dir "SteamBuildIDManager.exe")) { throw "Uninstaller left files behind." }

          $leftover = Get-ChildItem "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall" |
            Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like "*BuildID*" }
          if ($leftover) { throw "Uninstaller left the machine-wide registry entry behind." }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Steam-BuildID-Manager-Setup
          path: artifacts/installer/*.exe
          if-no-files-found: error

  release:
    name: Attach release assets
    runs-on: windows-latest
    needs: [publish, installer]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Collect launcher files for the release
        shell: pwsh
        run: |
          # Shipped separately as well: a user who downloaded only the .exe can drop these
          # next to it and double-click Start-Setup.cmd if the installer cannot use TEMP.
          New-Item -ItemType Directory -Path "release-assets/launcher" -Force | Out-Null
          Copy-Item "installer/launcher/Start-Setup.cmd" -Destination "release-assets/launcher" -Force
          Copy-Item "installer/launcher/Start-Setup.ps1" -Destination "release-assets/launcher" -Force

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.zip
            release-assets/**/*.exe
            release-assets/launcher/Start-Setup.cmd
            release-assets/launcher/Start-Setup.ps1
          generate_release_notes: true