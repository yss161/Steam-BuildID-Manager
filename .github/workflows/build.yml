name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Core tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore test project
        run: dotnet restore tests/SteamBuildIdManager.Core.Tests/SteamBuildIdManager.Core.Tests.csproj

      - name: Run regression tests
        run: dotnet run --project tests/SteamBuildIdManager.Core.Tests/SteamBuildIdManager.Core.Tests.csproj -c Release --no-restore

  publish:
    name: Build portable win-x64 package
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore app
        run: dotnet restore src/SteamBuildIdManager.App/SteamBuildIdManager.App.csproj -r win-x64

      - name: Publish self-contained app
        run: >
          dotnet publish src/SteamBuildIdManager.App/SteamBuildIdManager.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Platform=x64
          -p:WindowsAppSDKSelfContained=true
          -p:PublishReadyToRun=false
          -p:GenerateAppxPackageOnBuild=false
          -o publish
          --no-restore

      - name: Verify publish output
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/SteamBuildIDManager.exe")) {
            throw "SteamBuildIDManager.exe was not produced."
          }
          if (-not (Get-ChildItem "publish" -Filter "*.pri")) {
            throw "resources.pri was not produced; WinUI would fail to start."
          }

      - name: Create portable zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath Steam-BuildID-Manager-win-x64.zip -CompressionLevel Optimal

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Steam-BuildID-Manager-win-x64
          path: Steam-BuildID-Manager-win-x64.zip
          if-no-files-found: error

  installer:
    name: Build installer
    runs-on: windows-latest
    needs: publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download portable build
        uses: actions/download-artifact@v4
        with:
          name: Steam-BuildID-Manager-win-x64
          path: artifacts

      - name: Extract portable build
        shell: pwsh
        run: Expand-Archive -Path "artifacts/Steam-BuildID-Manager-win-x64.zip" -DestinationPath "publish" -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe was not found after installing Inno Setup." }
          & $iscc "installer\SteamBuildIDManager.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE." }

      - name: Smoke test install and uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem "artifacts/installer" -Filter "*.exe" | Select-Object -First 1
          if (-not $setup) { throw "Installer output was not produced." }

          $dir = Join-Path $env:RUNNER_TEMP "sbm-install-smoke"
          $install = Start-Process -FilePath $setup.FullName `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', "/DIR=$dir" `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)." }
          if (-not (Test-Path (Join-Path $dir "SteamBuildIDManager.exe"))) { throw "Installed exe is missing." }
          if (-not (Test-Path (Join-Path $dir "SteamBuildIDManager.pri"))) { throw "Installed PRI is missing." }

          # PrivilegesRequired=admin must register the app machine-wide, not per user.
          $key = Get-ChildItem "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall" |
            Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like "*BuildID*" } |
            Select-Object -First 1
          if (-not $key) { throw "Machine-wide uninstall entry was not created." }

          $uninstall = Start-Process -FilePath (Join-Path $dir "unins000.exe") `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' `
            -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with code $($uninstall.ExitCode)." }
          for ($i = 0; $i -lt 30 -and (Test-Path (Join-Path $dir "SteamBuildIDManager.exe")); $i++) {
            Start-Sleep -Seconds 1
          }
          if (Test-Path (Join-Path $dir "SteamBuildIDManager.exe")) { throw "Uninstaller left files behind." }

          $leftover = Get-ChildItem "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall" |
            Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like "*BuildID*" }
          if ($leftover) { throw "Uninstaller left the machine-wide registry entry behind." }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Steam-BuildID-Manager-Setup
          path: artifacts/installer/*.exe
          if-no-files-found: error

  release:
    name: Attach release assets
    runs-on: windows-latest
    needs: [publish, installer]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.zip
            release-assets/**/*.exe
          generate_release_notes: true